[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "minimatch@10.2.6 is bundled via @actions/glob@0.7.0 (runtime dep). The ReDoS vulnerability requires a crafted glob pattern in the report_paths input, which is controlled by the workflow author — not an external attacker. The fix requires @actions/glob to update its minimatch dependency to v11+; no independent fix is available."
